apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: {{ .Values.django.secretProvider.name }}
  namespace: {{ .Release.Namespace }}

spec:
  provider: aws

  parameters:
    region: {{ .Values.aws.region }}
    usePodIdentity: "true"

    objects: |
      - objectName: "{{ .Values.django.secretProvider.objectName }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: DJANGO_SECRET_KEY
            objectAlias: DJANGO_SECRET_KEY

          - path: DB_HOST
            objectAlias: DB_HOST

          - path: DB_NAME
            objectAlias: DB_NAME

          - path: DB_USER
            objectAlias: DB_USER

          - path: DB_PASS
            objectAlias: DB_PASS

  secretObjects:
    - secretName: {{ .Values.django.secret.name }}
      type: Opaque

      data:
        - objectName: DJANGO_SECRET_KEY
          key: DJANGO_SECRET_KEY

        - objectName: DB_HOST
          key: DB_HOST

        - objectName: DB_NAME
          key: DB_NAME

        - objectName: DB_USER
          key: DB_USER

        - objectName: DB_PASS
          key: DB_PASS

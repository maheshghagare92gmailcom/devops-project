
name: Deploy

on:
  push:
    branches:
      - main
      - prod

permissions:
  id-token: write
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

  ECR_REPOSITORY_APP: recipe-app-api-app-final
  ECR_REPOSITORY_PROXY: recipe-app-api-proxy-final

  HELM_PATH: django-app

jobs:

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4



      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow }}"


      # ---------------------------------------------------------
      # Configure AWS using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::360305064293:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}


      # ---------------------------------------------------------
      # Verify AWS identity
      # ---------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ---------------------------------------------------------
      # Login to Amazon ECR
      # ---------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ---------------------------------------------------------
      # Define image variables
      # ---------------------------------------------------------
      - name: Define image variables
        run: |
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"

          echo "APP_IMAGE_BASE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_APP }}" >> "$GITHUB_ENV"

          echo "PROXY_IMAGE_BASE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PROXY }}" >> "$GITHUB_ENV"

          echo "Using tag: sha-${GITHUB_SHA::7}"


      # ---------------------------------------------------------
      # Setup Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ---------------------------------------------------------
      # Build & Push Django APP image
      # ---------------------------------------------------------
      - name: Build and push Django APP image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ env.APP_IMAGE_BASE }}:latest
            ${{ env.APP_IMAGE_BASE }}:${{ env.SHA_TAG }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ---------------------------------------------------------
      # Build & Push Nginx PROXY image
      # ---------------------------------------------------------
      - name: Build and push PROXY image
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true

          tags: |
            ${{ env.PROXY_IMAGE_BASE }}:latest
            ${{ env.PROXY_IMAGE_BASE }}:${{ env.SHA_TAG }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ---------------------------------------------------------
      # Configure Git
      # ---------------------------------------------------------
      - name: Setup Git authentication
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git


      # ---------------------------------------------------------
      # Install yq
      # ---------------------------------------------------------
      - name: Install yq
        uses: mikefarah/yq@v4


      # ---------------------------------------------------------
      # Update Helm values.yaml
      # ---------------------------------------------------------
      - name: Update Helm image tags
        working-directory: ${{ env.HELM_PATH }}
        run: |

          NEW_TAG="${SHA_TAG}"

          echo "Updating Helm image tags to: ${NEW_TAG}"

          # Django image
          yq -i '.django.image.tag = strenv(NEW_TAG)' values.yaml

          # Proxy image
          yq -i '.proxy.image.tag = strenv(NEW_TAG)' values.yaml

          echo "Updated image tags:"
          yq '.django.image.tag' values.yaml
          yq '.proxy.image.tag' values.yaml


      # ---------------------------------------------------------
      # Commit updated Helm values
      # ---------------------------------------------------------
      - name: Commit and push Helm changes
        run: |

          git diff -- django-app/values.yaml

          if git diff --quiet -- django-app/values.yaml; then
            echo "No Helm values changes detected."
            exit 0
          fi

          git add django-app/values.yaml

          git commit \
            -m "Update Django and proxy images to ${SHA_TAG}"

          git push origin main


      # ---------------------------------------------------------
      # Complete
      # ---------------------------------------------------------
      - name: Deployment preparation complete
        run: |
          echo "=========================================="
          echo "Build and Push completed"
          echo "=========================================="
          echo "Django image:"
          echo "${APP_IMAGE_BASE}:${SHA_TAG}"
          echo ""
          echo "Proxy image:"
          echo "${PROXY_IMAGE_BASE}:${SHA_TAG}"
          echo ""
          echo "Helm values updated:"
          echo "django-app/values.yaml"
          echo "=========================================="


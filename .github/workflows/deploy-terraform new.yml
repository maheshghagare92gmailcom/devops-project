name: Deploy Terraform new

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:

  # ============================================================
  # TERRAFORM VALIDATION
  # ============================================================

  # test-terraform:
  #   name: Test Terraform
  #   uses: ./.github/workflows/test-terraform.yml


  # ============================================================
  # TERRAFORM DEPLOYMENT
  # ============================================================

  deploy:
    name: Terraform Deploy

    needs:
      - test-terraform

    runs-on: ubuntu-22.04

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # CONFIGURE AWS OIDC
      # ========================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::360305064293:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # VERIFY AWS IDENTITY
      # ========================================================

      - name: Verify AWS Identity
        run: |
          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity

          echo "=========================================="


      # ========================================================
      # SET TERRAFORM ENVIRONMENT
      # ========================================================

      - name: Set Terraform Environment
        run: |

          if [[ "${GITHUB_REF_NAME}" == "prod" ]]; then
            echo "TF_ENV=prod" >> "$GITHUB_ENV"
          else
            echo "TF_ENV=staging" >> "$GITHUB_ENV"
          fi


      # ========================================================
      # DISPLAY ENVIRONMENT
      # ========================================================

      - name: Display Terraform Environment
        run: |

          echo "=========================================="
          echo "TERRAFORM ENVIRONMENT"
          echo "=========================================="

          echo "Git branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""

          echo "Terraform workspace:"
          echo "${TF_ENV}"

          echo "=========================================="


      # ========================================================
      # TERRAFORM PLAN - VPC
      # ========================================================

      - name: Terraform Plan VPC
        working-directory: infra
        run: |

          set -e

          echo "=========================================="
          echo "TERRAFORM PLAN - VPC"
          echo "=========================================="

          docker compose run --rm \
            --entrypoint "" \
            -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            -e AWS_REGION="$AWS_REGION" \
            -e TF_VAR_env="$TF_ENV" \
            terraform \
            sh -c '

              set -e

              echo "=========================================="
              echo "TERRAFORM INIT - VPC"
              echo "=========================================="

              terraform \
                -chdir=deploy/01_VPC_terraform-manifests \
                init


              echo "=========================================="
              echo "TERRAFORM WORKSPACE - VPC"
              echo "=========================================="

              terraform \
                -chdir=deploy/01_VPC_terraform-manifests \
                workspace select -or-create "$TF_VAR_env"


              echo "Current workspace:"

              terraform \
                -chdir=deploy/01_VPC_terraform-manifests \
                workspace show


              echo "=========================================="
              echo "TERRAFORM PLAN - VPC"
              echo "=========================================="

              terraform \
                -chdir=deploy/01_VPC_terraform-manifests \
                plan

            '


      # ========================================================
      # TERRAFORM APPLY - VPC
      # ========================================================

      - name: Terraform Apply VPC
        working-directory: infra
        run: |

          set -e

          echo "=========================================="
          echo "TERRAFORM APPLY - VPC"
          echo "=========================================="

          docker compose run --rm \
            --entrypoint "" \
            -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            -e AWS_REGION="$AWS_REGION" \
            -e TF_VAR_env="$TF_ENV" \
            terraform \
            sh -c '

              set -e

              terraform \
                -chdir=deploy/01_VPC_terraform-manifests \
                init

              terraform \
                -chdir=deploy/01_VPC_terraform-manifests \
                workspace select -or-create "$TF_VAR_env"

              terraform \
                -chdir=deploy/01_VPC_terraform-manifests \
                apply -auto-approve

            '


      # ========================================================
      # TERRAFORM PLAN - EKS
      # ========================================================

      - name: Terraform Plan EKS
        working-directory: infra
        run: |

          set -e

          echo "=========================================="
          echo "TERRAFORM PLAN - EKS"
          echo "=========================================="

          echo "Expected workspace:"
          echo "${TF_ENV}"

          echo "=========================================="


          docker compose run --rm \
            --entrypoint "" \
            -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            -e AWS_REGION="$AWS_REGION" \
            -e TF_VAR_env="$TF_ENV" \
            terraform \
            sh -c '

              set -e


              # ==================================================
              # TERRAFORM VERSION
              # ==================================================

              echo ""
              echo "=========================================="
              echo "TERRAFORM VERSION"
              echo "=========================================="

              terraform version


              # ==================================================
              # HELM REPOSITORIES
              # ==================================================

              echo ""
              echo "=========================================="
              echo "HELM REPOSITORIES"
              echo "=========================================="

              helm repo add eks \
                https://aws.github.io/eks-charts \
                --force-update

              helm repo add efs \
                https://kubernetes-sigs.github.io/aws-efs-csi-driver/ \
                --force-update

              helm repo add csi \
                https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts \
                --force-update

              helm repo add argo \
                https://argoproj.github.io/argo-helm \
                --force-update

              helm repo update


              # ==================================================
              # TERRAFORM INIT
              # ==================================================

              echo ""
              echo "=========================================="
              echo "TERRAFORM INIT - EKS"
              echo "=========================================="

              terraform \
                -chdir=deploy/03_EKS_terraform-manifests \
                init


              # ==================================================
              # TERRAFORM WORKSPACE
              # ==================================================

              echo ""
              echo "=========================================="
              echo "TERRAFORM WORKSPACE - EKS"
              echo "=========================================="

              terraform \
                -chdir=deploy/03_EKS_terraform-manifests \
                workspace select -or-create "$TF_VAR_env"


              echo ""
              echo "Current workspace:"

              terraform \
                -chdir=deploy/03_EKS_terraform-manifests \
                workspace show


              echo ""
              echo "All workspaces:"

              terraform \
                -chdir=deploy/03_EKS_terraform-manifests \
                workspace list


              # ==================================================
              # BACKEND CONFIGURATION
              # ==================================================

              echo ""
              echo "=========================================="
              echo "BACKEND CONFIGURATION"
              echo "=========================================="

              if [ -f deploy/03_EKS_terraform-manifests/.terraform/terraform.tfstate ]; then

                grep -E \
                  "\"bucket\"|\"key\"|\"workspace_key_prefix\"|\"region\"|\"dynamodb_table\"" \
                  deploy/03_EKS_terraform-manifests/.terraform/terraform.tfstate

              else

                echo "ERROR: Terraform backend metadata not found."

                exit 1

              fi


              # ==================================================
              # TERRAFORM STATE
              # ==================================================

              echo ""
              echo "=========================================="
              echo "TERRAFORM STATE RESOURCES"
              echo "=========================================="

              terraform \
                -chdir=deploy/03_EKS_terraform-manifests \
                state list | sort


              # ==================================================
              # TERRAFORM PLAN
              # ==================================================

              echo ""
              echo "=========================================="
              echo "TERRAFORM PLAN - EKS"
              echo "=========================================="

              terraform \
                -chdir=deploy/03_EKS_terraform-manifests \
                plan


              echo ""
              echo "=========================================="
              echo "EKS PLAN COMPLETED"
              echo "=========================================="

            '


      # ========================================================
      # TERRAFORM APPLY - EKS
      #
      # DISABLED FOR NOW
      #
      # Enable ONLY after GitHub EKS plan matches local plan.
      # ========================================================

      # - name: Terraform Apply EKS
      #   working-directory: infra
      #   run: |
      #
      #     set -e
      #
      #     echo "=========================================="
      #     echo "TERRAFORM APPLY - EKS"
      #     echo "=========================================="
      #
      #     docker compose run --rm \
      #       --entrypoint "" \
      #       -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
      #       -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
      #       -e AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
      #       -e AWS_REGION="$AWS_REGION" \
      #       -e TF_VAR_env="$TF_ENV" \
      #       terraform \
      #       sh -c '
      #
      #         set -e
      #
      #         terraform \
      #           -chdir=deploy/03_EKS_terraform-manifests \
      #           init
      #
      #         terraform \
      #           -chdir=deploy/03_EKS_terraform-manifests \
      #           workspace select -or-create "$TF_VAR_env"
      #
      #         terraform \
      #           -chdir=deploy/03_EKS_terraform-manifests \
      #           apply -auto-approve
      #
      #       '


      # ========================================================
      # COMPLETE
      # ========================================================

      - name: Terraform Deployment Complete
        run: |

          echo "=========================================="
          echo "TERRAFORM DEPLOYMENT COMPLETED"
          echo "=========================================="

          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""

          echo "Terraform workspace:"
          echo "${TF_ENV}"

          echo "=========================================="

name: Test Application

on:
  workflow_call:

jobs:

  python:
    name: Python Tests and Lint
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Django Tests
      # ---------------------------------------------------------
      - name: Django Tests
        run: |
          docker compose run --rm app \
            sh -c "python manage.py wait_for_db && python manage.py test"


      # ---------------------------------------------------------
      # Python Flake8
      # ---------------------------------------------------------
      - name: Python Flake8
        run: |
          docker compose run --rm app \
            sh -c "flake8"

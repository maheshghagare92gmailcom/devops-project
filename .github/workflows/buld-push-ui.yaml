name: Build and Push UI Service to ECR

on:
  push:
    branches: ["main"]
   

permissions:
  id-token: write
  contents: write

concurrency:
  group: build-and-push-ui
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_APP: recipe-app-api-app-final
  ECR_REPOSITORY_PROXY: recipe-app-api-proxy-final
  HELM_PATH: django-app

jobs:
  build-and-push-ui:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔹 Configure AWS (OIDC)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::837318114635:role/github-actions-oidc-role-ui3
          aws-region: ${{ env.AWS_REGION }}

      # 🔹 Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 🔹 Set variables
      - name: Define image variables
        run: |
          echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV

          echo "APP_IMAGE_BASE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_APP }}" >> $GITHUB_ENV
          echo "PROXY_IMAGE_BASE=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PROXY }}" >> $GITHUB_ENV

          echo "Using tag: sha-${GITHUB_SHA::7}"

      # 🔹 Setup Docker Buildx (for caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔹 Build & Push APP image
      - name: Build and push APP image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE_BASE }}:latest
            ${{ env.APP_IMAGE_BASE }}:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🔹 Build & Push PROXY image
      - name: Build and push PROXY image
        uses: docker/build-push-action@v5
        with:
          context: ./proxy
          push: true
          tags: |
            ${{ env.PROXY_IMAGE_BASE }}:latest
            ${{ env.PROXY_IMAGE_BASE }}:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🔹 Setup Git authentication
      - name: Setup Git auth
        run: |
          git config --global user.name "ci-bot"
          git config --global user.email "ci-bot@stacksimplify.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      # 🔹 Install yq
      - name: Install yq
        uses: mikefarah/yq@v4

      # 🔹 Update Helm values.yaml
      - name: Update Helm values with new image tag
        run: |
          cd $HELM_PATH

          NEW_TAG=${SHA_TAG}
          echo "Updating image tags to: $NEW_TAG"

          # Update tags
          yq -i '.deployments.app.image.tag = strenv(NEW_TAG)' values.yaml
          yq -i '.deployments.proxy.image.tag = strenv(NEW_TAG)' values.yaml

          echo "Updated values.yaml:"
          grep tag values.yaml

          # Commit only if changes exist
          git diff --quiet || (
            git add values.yaml
            git commit -m "Update app & proxy image tag to $NEW_TAG"
            git push origin main
          )

      # 🔹 Done
      - name: CI Complete
        run: |
          echo "Build, push, and Helm update completed successfully"
          echo "Tag used: $SHA_TAG"

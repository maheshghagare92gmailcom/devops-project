apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: django-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/maheshghagare92gmailcom/devops-project.git
    targetRevision: main
    path: helm/django-chart

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

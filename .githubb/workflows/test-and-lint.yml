name: Test and Lint

on:
  workflow_call:
    secrets:
      DOCKERHUB_USER:
        required: true
        description: "Username for DockerHub auth"
      DOCKERHUB_TOKEN:
        required: true
        description: "Token for DockerHub auth"

jobs:
  python:
    name: Python
    runs-on: ubuntu-22.04

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: docker compose run --rm app sh -c "python manage.py wait_for_db && python manage.py test"

      - name: Python flake8
        run: docker compose run --rm app sh -c "flake8"

  terraform:
    name: Terraform
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        dir:
          - setup
          - deploy/01_VPC_terraform-manifests
          - deploy/03_EKS_terraform-manifests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Debug Terraform Paths
        working-directory: infra
        run: docker compose run --rm --entrypoint sh terraform -c "pwd"

      - name: Terraform Init
        working-directory: infra
        run: |
          docker compose run --rm terraform \
            -chdir=${{ matrix.dir }} init -backend=false

      - name: Terraform Format Check
        working-directory: infra
        run: |
          docker compose run --rm terraform \
            -chdir=${{ matrix.dir }} fmt -check

      - name: Terraform Validate
        working-directory: infra
        run: |
          docker compose run --rm terraform \
            -chdir=${{ matrix.dir }} validate
